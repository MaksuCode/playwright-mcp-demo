<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — ShopDemo</title>
  <style>
    body { font-family: sans-serif; max-width: 960px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
    .filters { display: flex; gap: 8px; margin-bottom: 20px; }
    .filters button { padding: 6px 14px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
    .filters button:hover { background: #f0f0f0; }
    [data-testid="product-grid"] { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .product-card { border: 1px solid #ddd; border-radius: 6px; padding: 16px; }
    .product-card span[data-testid="product-name"] { font-weight: 700; font-size: 1.05rem; display: block; margin-bottom: 4px; }
    .product-card span[data-testid="product-category"] { font-size: 0.8rem; color: #666; display: block; margin-bottom: 6px; }
    .product-card span[data-testid="product-price"] { font-size: 1.1rem; color: #0070f3; display: block; margin-bottom: 8px; }
    .product-card p { font-size: 0.85rem; color: #555; margin: 0 0 12px; }
    .product-card button { width: 100%; padding: 8px; background: #0070f3; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .product-card button:hover { background: #005bb5; }
    .cart-link { position: relative; text-decoration: none; }
    [data-testid="cart-count"] { background: #e00; color: #fff; border-radius: 50%; padding: 2px 6px; font-size: 0.75rem; margin-left: 4px; }
    .user-info { display: flex; gap: 12px; align-items: center; }
    button[data-testid="logout-button"] { padding: 6px 12px; background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>ShopDemo</h1>
    <div class="user-info">
      <span>Logged in as <span data-testid="user-email"></span></span>
      <a data-testid="cart-link" href="/cart.html">Cart <span data-testid="cart-count">0</span></a>
      <button data-testid="logout-button">Logout</button>
    </div>
  </header>

  <div class="filters">
    <button data-testid="filter-all">All</button>
    <button data-testid="filter-electronics">Electronics</button>
    <button data-testid="filter-apparel">Apparel</button>
  </div>

  <div data-testid="product-grid"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
