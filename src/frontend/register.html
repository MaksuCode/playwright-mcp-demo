<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — ShopDemo</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 80px auto; padding: 0 16px; }
    h1 { margin-bottom: 24px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    input { display: block; width: 100%; padding: 8px; margin-bottom: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { width: 100%; padding: 10px; background: #0070f3; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #005bb5; }
    [data-testid="error-message"] { display: none; color: #c00; margin-bottom: 12px; padding: 8px; background: #fee; border-radius: 4px; }
    .footer { margin-top: 16px; text-align: center; }
  </style>
</head>
<body>
  <h1>Register</h1>
  <div data-testid="error-message"></div>
  <label for="email">Email</label>
  <input data-testid="email-input" id="email" type="email" placeholder="you@example.com" />
  <label for="password">Password</label>
  <input data-testid="password-input" id="password" type="password" placeholder="Password" />
  <label for="confirm">Confirm Password</label>
  <input data-testid="confirm-password-input" id="confirm" type="password" placeholder="Confirm password" />
  <button data-testid="register-button">Register</button>
  <div class="footer">
    Have an account? <a data-testid="login-link" href="/login.html">Login</a>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
